YFeG3deJcBg88nw3WZY7L80pbQ==</script><script>(async () => {const post = "2024_04";const storage = "devlog-keys";const types = {gif: "image/gif",jpg: "image/jpeg",jpeg: "image/jpeg",png: "image/png",svg: "image/svg+xml",webp: "image/webp",mp4: "video/mp4",webm: "video/webm"};const loadKeys = () => {try {return JSON.parse(localStorage.getItem(storage)) || {};}catch (e) {return {};}};const saveKey = password => {try {localStorage.setItem(storage, JSON.stringify({...loadKeys(), [post]: password}));}catch (e) {}};const deriveKey = async password => {const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);return crypto.subtle.deriveKey({name: "PBKDF2", salt: new TextEncoder().encode("koi-devlog/2024_04"), iterations: 200000, hash: "SHA-256"},material, {name: "AES-GCM", length: 256}, false, ["decrypt"]);};const decrypt = (key, data) => crypto.subtle.decrypt({name: "AES-GCM", iv: data.subarray(0, 12)}, key, data.subarray(12));const decryptMedia = key => document.querySelectorAll("[data-enc]").forEach(async element => {const path = element.dataset.enc;const response = await fetch(path);const data = await decrypt(key, new Uint8Array(await response.arrayBuffer()));element.src = URL.createObjectURL(new Blob([data], {type: types[path.split(".").pop().toLowerCase()]}));if (element.parentElement instanceof HTMLVideoElement)element.parentElement.load();});const payload = Uint8Array.from(atob(document.getElementById("payload").textContent), c => c.charCodeAt(0));const passwords = [new URLSearchParams(location.hash.slice(1)).get("k"), loadKeys()[post]];for (const password of passwords.filter(password => password)) {try {const key = await deriveKey(password);document.getElementById("content").innerHTML = new TextDecoder().decode(await decrypt(key, payload));saveKey(password);decryptMedia(key);return;}catch (e) {}}document.querySelector("#post.locked").style.visibility = "visible";})();</script></body></html>
